[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shazam-popular-segments"
version = "0.1.0"
description = "CLI prototype for extracting Shazam Popular Segments clips."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
shazam-segment = "shazam_segments.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "pillow>=10", "pytesseract>=0.3.10"]
flask = ["flask>=3.0", "yt-dlp>=2025.1.1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
